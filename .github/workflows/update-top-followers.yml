name: Update Top Followers

on:
  schedule:
    # Runs daily at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch_top_followers.py
        env:
          GH_HANDLE: ${{ github.repository_owner }}
          # Tune these to control how many followers make the list:
          TABLE_MAX_ENTRIES: "30"          # how many show up in the README table
          QUOTA_BASE_MULTIPLIER: "6"        # higher = more lenient on modest accounts
          MAX_FOLLOW_RATIO: "30"            # hard cutoff: following/followers above this is treated as spam
          INACTIVITY_THRESHOLD: "5"         # min contributions/year to count as "active"
          STAR_WEIGHT: "3.0"                # higher = starred repos matter more in ranking
          RATIO_PENALTY_WEIGHT: "0.5"       # higher = penalize high following:follower ratio more
        run: |
          python scripts/fetch_top_followers.py "$GH_HANDLE" "${{ secrets.GITHUB_TOKEN }}" README.md

      - name: Commit changes if README updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "No changes to commit"
          else
            git add README.md
            git commit -m "chore: update top followers section"
            git push
          fi
